# The remote-searching relay (docs/REMOTE.md): rooms where a ForeverTAS window
# and its machines meet, and groups. Deployed at forevertas.tmtas.exchange.
name = "forevertas-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# The domain forevertas.tmtas.exchange is attached to the Worker as a custom
# domain (once, with the account API: PUT /accounts/{id}/workers/domains), so
# deploying needs no permission on the zone's routes.

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "GROUPS"
class_name = "Group"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Group"]

[[durable_objects.bindings]]
name = "SHARDS"
class_name = "Shard"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Shard"]

# per address (Workers rate limiting: periods of 10 or 60 s)
[[ratelimits]]
name = "LIMIT_NEW"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMIT_CONNECT"
namespace_id = "1002"
simple = { limit = 600, period = 60 }
