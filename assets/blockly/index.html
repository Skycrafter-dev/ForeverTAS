<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' qrc: data:; script-src 'self' qrc: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' qrc: data:; connect-src 'none'; object-src 'none'; frame-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="editor.css">
  <script src="qrc:/blockly/third_party/blockly/blockly_compressed.js"></script>
  <script src="qrc:/blockly/third_party/blockly/en.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="examples.js"></script>
</head>
<body>
  <div id="editorShell">
    <div id="searchDock" role="search" aria-label="Block search">
      <span class="searchIcon">⌕</span>
      <input id="blockSearch" autocomplete="off" spellcheck="false"
             placeholder="Search blocks…" aria-label="Search blocks">
      <button id="clearSearch" type="button" aria-label="Clear search">×</button>
      <div id="searchResults" role="region" aria-label="Block search results"
           aria-live="polite"></div>
    </div>
    <div id="viewerPickDock" role="group" aria-label="Viewer target picker" hidden>
      <button id="viewerPickButton" type="button"></button>
      <span id="viewerPickStatus" role="status" aria-live="polite"></span>
    </div>
    <div id="blocklyDiv" aria-label="Visual search workspace"></div>
    <div id="projectDock" role="toolbar" aria-label="Block programs">
      <select id="projectAction" aria-label="Program and library actions">
        <option value="">Program…</option>
        <option value="new">New program</option><option value="open">Open program…</option>
        <option value="save">Save program…</option><option value="library">Add block library…</option>
        <option value="feedback">Example: feedback control</option>
        <option value="branches">Example: parallel branches</option>
      </select>
    </div>
    <div id="runtimeDock" role="toolbar" aria-label="Block execution">
      <button id="runProgram" type="button">Run</button>
      <button id="debugProgram" type="button" title="Start paused before the first block">Debug</button>
      <button id="pauseProgram" type="button">Pause</button>
      <button id="resumeProgram" type="button">Continue</button>
      <button id="stepProgram" type="button">Step</button>
      <select id="stepKind" aria-label="Step kind">
        <option value="into">Into</option><option value="over">Over</option>
        <option value="out">Out</option><option value="tick">Tick</option>
      </select>
      <button id="stopProgram" type="button">Stop</button>
      <label><input id="inspectProgram" type="checkbox">Inspect</label>
      <span id="runtimeStatus" role="status"></span>
    </div>
    <section id="runtimeInspector" aria-label="Runtime variables and state" hidden>
      <input id="watchFilter" placeholder="Filter variables and state…" aria-label="Filter runtime values">
      <div id="runtimeValues"></div>
    </section>
    <div id="diagnostics" role="alert" aria-live="assertive" hidden></div>
    <div id="readOnlyShield" role="status" aria-live="polite" hidden>
      <div class="readOnlyNotice">Search is running · stop to edit blocks</div>
    </div>
    <div id="loadingState" role="status" aria-live="polite">Loading block editor…</div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
